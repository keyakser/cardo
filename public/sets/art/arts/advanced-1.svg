    <path d="M130 106C140 98 160 98 172 108" stroke="#6a9cc8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="rotate(30 242 200)"><rect x="236" y="170" width="12" height="56" rx="4" fill="#f04e1f"/><polygon points="236,170 248,170 242,150" fill="#1a1714"/></g>
