    <rect x="95" y="234" width="110" height="90" rx="4" fill="#1a1714"/>
    <rect x="85" y="222" width="130" height="16" rx="4" fill="#1a1714"/>
    <path d="M92 226C92 182 208 182 208 226Z" fill="#f1e3c8"/>
    <rect x="138" y="152" width="24" height="40" fill="#f1e3c8"/>
