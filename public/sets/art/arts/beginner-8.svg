      <feComposite in="SourceGraphic" in2="dots" operator="in"/>
    </filter>
  </defs>
  <rect width="300" height="380" fill="#8c8519"/>
  <rect width="300" height="380" fill="#fff6e6" opacity="0.5" filter="url(#p)"/>
