    <rect x="50" y="164" width="180" height="44" rx="6" fill="#1a1714"/>
    <rect x="217" y="170" width="8" height="32" fill="#f1e3c8"/>
    <g transform="rotate(-5 160 143)"><rect x="85" y="122" width="150" height="42" rx="6" fill="#8c8519"/><rect x="222" y="128" width="8" height="30" fill="#f1e3c8"/></g>
