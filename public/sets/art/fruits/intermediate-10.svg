    <path d="M150 100c-12 0-14 20-16 34-20 10-28 30-24 50 4 22 22 30 40 30s36-8 40-30c4-20-4-40-24-50-2-14-4-34-16-34z" fill="#8c8519"/>
    <path d="M60 150C60 210 170 230 236 188C170 200 100 186 84 150Z" fill="#f1e3c8"/>
