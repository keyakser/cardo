    <circle cx="192" cy="196" r="40" fill="#6a9cc8"/>
    <rect x="105" y="142" width="6" height="18" rx="4" fill="#1a1714" transform="rotate(-10 108 151.0)"/>
    <path d="M50 212h200c0 58-44 94-100 94s-100-36-100-94z" fill="#1a1714"/>
