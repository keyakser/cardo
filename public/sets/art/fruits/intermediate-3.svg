    <circle cx="160" cy="210" r="8" fill="#e58bcb"/>
    <circle cx="180" cy="206" r="8" fill="#e58bcb"/>
    <circle cx="200" cy="214" r="8" fill="#e58bcb"/>
    <circle cx="152" cy="230" r="8" fill="#e58bcb"/>
