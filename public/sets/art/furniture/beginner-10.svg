  <rect width="300" height="380" fill="#f1e3c8"/>
  <rect width="300" height="380" fill="#fff6e6" opacity="0.5" filter="url(#p)"/>
  <g filter="url(#g)">
    <ellipse cx="150" cy="302" rx="60" ry="12" fill="#1a1714" opacity="0.85"/><g transform="rotate(-40 150 190)"><path d="M136 46c34 20 36 80 30 144h-30z" fill="#6a9cc8"/><rect x="128" y="186" width="46" height="14" rx="4" fill="#1a1714"/><rect x="133" y="198" width="36" height="120" rx="12" fill="#f04e1f"/><circle cx="151" cy="234" r="5" fill="#1a1714"/><circle cx="151" cy="282" r="5" fill="#1a1714"/></g>
  </g>
</svg>
