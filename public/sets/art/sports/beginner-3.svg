    <g transform="rotate(-12 150 194)"><rect x="64" y="186" width="172" height="16" rx="6" fill="#1a1714"/><rect x="56" y="138" width="32" height="112" rx="10" fill="#f04e1f"/><rect x="212" y="138" width="32" height="112" rx="10" fill="#f04e1f"/><rect x="88" y="154" width="20" height="80" rx="6" fill="#f1e3c8"/><rect x="192" y="154" width="20" height="80" rx="6" fill="#f1e3c8"/><rect x="42" y="176" width="14" height="36" rx="5" fill="#1a1714"/><rect x="244" y="176" width="14" height="36" rx="5" fill="#1a1714"/></g>
  </g>
