    <path d="M80 116V300M102 116V300M124 116V300M146 116V300M168 116V300M190 116V300M212 116V300M234 116V300M56 140H244M56 164H244M56 188H244M56 212H244M56 236H244M56 260H244M56 284H244" stroke="#1a1714" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M50 300V110H250V300" stroke="#f1e3c8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="160" cy="300" rx="34" ry="6" fill="#1a1714" opacity="0.85"/>
