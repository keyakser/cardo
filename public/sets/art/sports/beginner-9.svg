    <circle cx="85" cy="240" r="8" fill="#1a1714"/>
    <circle cx="215" cy="240" r="8" fill="#1a1714"/>
    <path d="M85 240L140 240L125 166ZM125 166L200 170L140 240M200 170L215 240" stroke="#6a9cc8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M200 170L194 144L222 138" stroke="#1a1714" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="106" y="152" width="40" height="13" rx="6" fill="#f1e3c8"/>
