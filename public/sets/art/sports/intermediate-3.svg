    <circle cx="60" cy="240" r="8" fill="#1a1714"/>
    <circle cx="80" cy="240" r="8" fill="#1a1714"/>
    <circle cx="210" cy="264" r="7" fill="#1a1714"/>
    <circle cx="230" cy="264" r="7" fill="#1a1714"/>
    <circle cx="250" cy="264" r="7" fill="#1a1714"/>
    <polygon points="150,90 157.6,109.5 178.5,110.7 162.4,124 167.6,144.3 150,133 132.4,144.3 137.6,124 121.5,110.7 142.4,109.5" fill="#e58bcb"/>
