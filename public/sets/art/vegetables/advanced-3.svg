    <path d="M0 0c30 -30 70 -30 100 0c-30 30 -70 30 -100 0z" fill="#8c8519" transform="translate(150 160) rotate(-60)"/>
    <path d="M0 0c30 -30 70 -30 100 0c-30 30 -70 30 -100 0z" fill="#8c8519" transform="translate(150 160) rotate(-120)"/>
    <path d="M0 0c33 -33 77 -33 110 0c-33 33 -77 33 -110 0z" fill="#8c8519" transform="translate(150 160) rotate(-90)"/>
    <path d="M150 280c4 16 0 30-10 40" stroke="#1a1714" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="222" r="68" fill="#f1e3c8"/>
    <path d="M82 216c0-40 30-64 68-64s68 24 68 64c-30-12-46-14-68-14s-38 2-68 14z" fill="#e58bcb"/>
