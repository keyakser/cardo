    <ellipse cx="150" cy="212" rx="94" ry="82" fill="#f04e1f"/>
    <path d="M88 196c-4 26 4 52 22 66" stroke="#f1e3c8" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M120 140c-4 20-4 30 2 44M180 140c4 20 4 30-2 44" stroke="#1a1714" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3"/>
    <polygon points="150,90 157,123.9 189.8,113 164,136 189.8,159 157,148.1 150,182 143,148.1 110.2,159 136,136 110.2,113 143,123.9" fill="#8c8519"/>
    <rect x="146" y="104" width="8" height="30" rx="4" fill="#8c8519" transform="rotate(15 150 120)"/>
