    <path d="M100 150c30 30 70 30 100 0" stroke="#f1e3c8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M150 130v140" stroke="#f1e3c8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M150 200l-40 40M150 200l40 40M150 170l-30-20M150 170l30-20" stroke="#f1e3c8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
