    <path d="M60 190c50 10 90 40 110 100" stroke="#8c8519" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M66 124c40 40 86 76 114 150" stroke="#f1e3c8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
    <ellipse cx="96" cy="296" rx="14" ry="10" fill="#f1e3c8" transform="rotate(-10 96 296)"/>
    <ellipse cx="126" cy="304" rx="14" ry="10" fill="#f1e3c8" transform="rotate(10 126 304)"/>
    <ellipse cx="216" cy="300" rx="14" ry="10" fill="#f1e3c8" transform="rotate(-20 216 300)"/>
