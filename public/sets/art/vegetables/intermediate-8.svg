    <circle cx="170" cy="120" r="12" fill="#f1e3c8"/>
    <circle cx="206" cy="160" r="8" fill="#f1e3c8"/>
    <circle cx="150" cy="166" r="7" fill="#f1e3c8"/>
    <rect x="214" y="260" width="22" height="44" rx="10" fill="#f1e3c8"/>
